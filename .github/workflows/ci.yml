name: CI/CD

# Her gönderimde kontrol + web ve Android derlemesi.
# main dalına gönderim ve v* etiketleri itch.io'ya yayınlanır; v* etiketleri ayrıca
# GitHub Release oluşturur. Kurulum: docs/YAYINLAMA.md
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Bu çalıştırmayı itch.io'ya yayınla"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  check:
    name: Kontrol (lint, tip, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  version:
    name: Sürüm bilgisi
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            base=$(node -p "require('./package.json').version")
            name="${base}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $name (kod $GITHUB_RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web derlemesi
    needs: [check, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: kamyoncu-web
          path: dist
          if-no-files-found: error

  android:
    name: Android APK
    needs: [check, version]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.name }}
      - run: npx cap sync android

      - name: İmzalama anahtarını hazırla
        run: |
          # Dört sırrın hepsi varsa release imzası; hiçbiri yoksa debug; eksikse uyarı + debug.
          set=0
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] && set=$((set + 1))
          done
          if [ "$set" -eq 4 ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "İmza: release anahtarı" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$set" -gt 0 ]; then
              echo "::warning::Android imzalama sırlarının yalnızca $set/4 tanesi tanımlı; debug APK derleniyor. Bkz. docs/YAYINLAMA.md"
            fi
            echo "İmza: debug anahtarı (release sırları tanımlı değil)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: APK derle
        working-directory: android
        run: |
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then task=assembleRelease; type=release; else task=assembleDebug; type=debug; fi
          ./gradlew "$task" --no-daemon \
            -PversionCode=${{ needs.version.outputs.code }} \
            -PversionName=${{ needs.version.outputs.name }}
          mkdir -p ../apk
          cp app/build/outputs/apk/$type/app-$type.apk "../apk/kamyoncu-${{ needs.version.outputs.name }}-$type.apk"
          echo "APK türü: $type" >> "$GITHUB_STEP_SUMMARY"

      - name: İmzayı doğrula
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          for apk in apk/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee signer.txt
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'certificate (DN|SHA-256)' signer.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: kamyoncu-android
          path: apk/*.apk
          if-no-files-found: error

  deploy-itch:
    name: itch.io'ya yayınla
    needs: [web, android, version]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ secrets.ITCH_GAME }}
    steps:
      - name: Ayarları denetle
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::error::BUTLER_API_KEY ve ITCH_GAME (ör. kullanici/kamyoncu) sırları tanımlı olmalı. Bkz. docs/YAYINLAMA.md"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: kamyoncu-web
          path: web
      - uses: actions/download-artifact@v4
        with:
          name: kamyoncu-android
          path: apk
      - name: butler kur
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V
      - name: Web sürümünü gönder (html5 kanalı)
        run: ./butler/butler push web "$ITCH_GAME:html5" --userversion "${{ needs.version.outputs.name }}"
      - name: APK'yı gönder (android kanalı)
        run: ./butler/butler push apk "$ITCH_GAME:android" --userversion "${{ needs.version.outputs.name }}"

  release:
    name: GitHub Release
    needs: [web, android, version]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kamyoncu-web
          path: web
      - uses: actions/download-artifact@v4
        with:
          name: kamyoncu-android
          path: apk
      - run: (cd web && zip -qr "../kamyoncu-${{ needs.version.outputs.name }}-web.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            kamyoncu-*-web.zip
            apk/*.apk
